<style>
/* Antly. Warm minimalist, indigo palette: single phone-width column, tonal layers, indigo for completion, amber for priority, mint for nutrition. */
:root{
  color-scheme:light;
  --bg:#f4f5fc; --card:#ffffff; --wash:#eceefa; --wash2:#e3e6f6; --line:#dfe2f3;
  --fg:#181a2e; --fg2:#444a6e; --fg3:#767b9c;
  --sage:#3a43ad; --sage-c:#4f5bd5; --on-sage:#ffffff; --sage-t:rgba(79,91,213,.14);
  --terra:#97500f; --terra-c:#e0883f; --terra-t:rgba(224,136,63,.17);
  --olive:#256b5e; --olive-c:#3f9a8a; --olive-t:rgba(63,154,138,.18);
  --track:#dfe2f3; --shadow:0 4px 20px rgba(24,26,46,.07); --scrim:rgba(24,26,46,.42);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1020; --card:#171930; --wash:#1d2040; --wash2:#252a52; --line:#2b2f55;
  --fg:#e7e8f8; --fg2:#b6b9dc; --fg3:#8387ad;
  --sage:#aab2f5; --sage-c:#4f5bd5; --sage-t:rgba(170,178,245,.16);
  --terra:#f3b987; --terra-c:#e0883f; --terra-t:rgba(243,185,135,.16);
  --olive:#8ad2c4; --olive-c:#3f9a8a; --olive-t:rgba(138,210,196,.16);
  --track:#2b2f55; --shadow:0 4px 20px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1020; --card:#171930; --wash:#1d2040; --wash2:#252a52; --line:#2b2f55;
  --fg:#e7e8f8; --fg2:#b6b9dc; --fg3:#8387ad;
  --sage:#aab2f5; --sage-c:#4f5bd5; --sage-t:rgba(170,178,245,.16);
  --terra:#f3b987; --terra-c:#e0883f; --terra-t:rgba(243,185,135,.16);
  --olive:#8ad2c4; --olive-c:#3f9a8a; --olive-t:rgba(138,210,196,.16);
  --track:#2b2f55; --shadow:0 4px 20px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:20px;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ms{visibility:hidden}
html.icons .ms{visibility:visible}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:22px;line-height:1;display:inline-block;width:1em;height:1em;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:middle;font-variation-settings:'FILL' 0,'wght' 400}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400}
.ms.s14{font-size:14px}.ms.s16{font-size:16px}.ms.s18{font-size:18px}.ms.s20{font-size:20px}.ms.s24{font-size:24px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 0;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.015em}
.logo{width:36px;height:36px;border-radius:10px;display:block}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--sage-c);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px}
.eyebrow{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3)}
.h-xl{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
.h-md{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.015em}
.h-sm{font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.01em}
.muted{color:var(--fg2)}.faint{color:var(--fg3)}.num{font-variant-numeric:tabular-nums}
.view{display:none;flex-direction:column;gap:28px;padding-top:8px}
.view.on{display:flex}
.sec{display:flex;flex-direction:column;gap:12px}

.link{color:var(--sage);font-weight:600;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px}
.card.sm{border-radius:16px;padding:14px 16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pill.sage{background:var(--sage-t);color:var(--sage)}.pill.terra{background:var(--terra-t);color:var(--terra)}.pill.olive{background:var(--olive-t);color:var(--olive)}.pill.wash{background:var(--wash2);color:var(--fg2)}.pill.over{background:var(--terra-t);color:var(--terra)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden}

.macrobar{display:flex;gap:2px;height:8px;border-radius:999px;overflow:hidden;background:var(--track)}
.macrobar i{display:block;height:100%}
.empty{padding:14px 16px;border:1.5px dashed var(--line);border-radius:16px;color:var(--fg3);text-align:center}
/* Today */
.harmony{display:flex;flex-direction:column;gap:16px}
.harmony-row{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:96px;height:96px;flex:none}

.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:24px;line-height:26px;font-weight:600;letter-spacing:-.02em}
.ring .c span{font-size:10px;letter-spacing:.08em;color:var(--fg3);font-weight:600}
.meters{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.meter-h{display:flex;justify-content:space-between;font-size:12px;font-weight:500;margin-bottom:4px}
.note{display:flex;align-items:center;gap:10px;background:var(--wash);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--fg2)}
.prime{display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.prime .t{flex:1;min-width:0}
.prime .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;color:var(--fg3);font-size:13px;align-items:center}
.chips{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:0 max(16px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar{display:none}
.rt{flex:none;width:142px;min-height:136px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative}
.rt .ic{width:40px;height:40px;border-radius:12px;background:var(--wash2);color:var(--fg2);display:grid;place-items:center}
.rt.done .ic{background:var(--sage-c);color:#fff}
.rt .ck{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;background:var(--sage-c);color:#fff;display:none;place-items:center}
.rt.done .ck{display:grid}
.rt b{font-weight:600;display:block;overflow-wrap:anywhere}
.rt small{color:var(--fg2);font-size:13px}
.mood{display:flex;justify-content:space-between;gap:6px}
.mood button{flex:1;height:52px;border-radius:16px;background:var(--wash);color:var(--fg3);display:grid;place-items:center}
.mood button[aria-pressed="true"]{background:var(--sage-c);color:#fff}
.mood-note{margin-top:12px;font-size:13px;color:var(--fg2)}
.glance{padding:4px 16px}
.glance .r{display:flex;align-items:center;gap:12px;padding:12px 0}
.glance .r+.r{border-top:1px solid var(--wash)}
.glance .ic{width:36px;height:36px;border-radius:50%;background:var(--wash);display:grid;place-items:center;color:var(--sage);flex:none}
.glance .m{flex:1;min-width:0}
.glasses{display:flex;gap:4px;margin-top:8px}
.glasses i{flex:1;height:6px;border-radius:999px;background:var(--track)}
.glasses i.on{background:var(--sage-c)}
.plus{width:44px;height:44px;border-radius:50%;background:var(--wash);display:grid;place-items:center;flex:none}
.quote{display:flex;gap:14px;align-items:center;background:var(--wash);border-radius:20px;padding:16px}

.quote em{font-style:italic;display:block;color:var(--fg2)}
/* Tasks */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav .t{flex:1;min-width:0}
.weekcard{background:var(--wash);border-radius:20px;padding:8px;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;border-radius:14px;color:var(--fg2)}
.day small{font-size:12px;font-weight:600;color:var(--fg3)}
.day b{font-size:16px;font-weight:600}
.day i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.day i.has{background:var(--sage-c)}
.day.is-today b{color:var(--sage)}
.day[aria-pressed="true"]{background:var(--sage-c);color:#fff}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] b{color:#fff}
.day[aria-pressed="true"] i{background:#fff}
.group-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.group-h .l{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.group-h .l .ms{color:var(--sage)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:stretch;background:var(--card);border-radius:16px;min-height:56px;border:1px solid transparent}
.rowmain{flex:1;min-width:0;display:flex;align-items:flex-start;gap:14px;padding:14px 4px 14px 16px;text-align:left;border-radius:16px}
.rowmain:active{background:var(--wash)}
.rowx{width:44px;flex:none;color:var(--fg3);display:grid;place-items:center;border-radius:16px}
.cb{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--fg3);display:grid;place-items:center;color:transparent;margin-top:1px}
.row.done .cb{background:var(--sage-c);border-color:var(--sage-c);color:#fff}
.tx{flex:1;min-width:0}
.tx>span{display:block;font-size:15px;line-height:22px;overflow-wrap:anywhere}
.row.done .tx>span:first-child{text-decoration:line-through;color:var(--fg2)}
.tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.time{display:inline-flex;align-items:center;gap:4px;color:var(--fg3);font-size:13px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;background:var(--sage-c);color:#fff;font-weight:600;font-size:14px}
.btn:active{filter:brightness(.9)}
.btn.sm{height:40px;padding:0 16px;border-radius:12px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--terra)}
.addbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 16px;box-shadow:var(--shadow)}

.insight{display:flex;gap:14px;align-items:center;background:var(--wash);border-radius:20px;padding:16px}
.insight .ic{width:44px;height:44px;border-radius:12px;background:var(--wash2);display:grid;place-items:center;color:var(--sage);flex:none}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--wash);display:grid;place-items:center;flex:none}

/* Goals */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:0 max(16px,env(safe-area-inset-right,0px))}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;height:36px;padding:0 18px;border-radius:999px;background:var(--wash2);color:var(--fg2);font-weight:500}

.goal{display:flex;flex-direction:column;gap:14px}
.goal-top{display:flex;gap:10px;align-items:flex-start}

.goal-top .tags{margin:0 0 8px}
.fire{display:inline-flex;align-items:center;gap:3px;color:var(--terra);font-weight:600;font-size:13px}
.goal h3{font-size:19px;line-height:25px;font-weight:600;letter-spacing:-.015em;overflow-wrap:anywhere}
.goal.done h3{text-decoration:line-through;color:var(--fg2)}
.week{background:var(--wash);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.week-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;align-items:center}
.week-h span:last-child{color:var(--sage)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--fg2)}

.wd.today i{outline:2px solid var(--sage-c);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:6px;background:var(--wash);border-radius:12px;padding:4px}

.stepper span{min-width:46px;text-align:center;font-weight:600;font-size:13px}
.range{width:100%;accent-color:var(--sage-c)}
.pin{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--fg3)}
.pin.on{color:var(--sage)}
.weeks{display:flex;align-items:flex-end;gap:10px;height:110px}
.weeks div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.weeks i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--sage-t);min-height:6px}
.weeks div.cur i{background:var(--sage-c)}
.weeks small{font-size:11px;color:var(--fg3);font-weight:600}
.weeks b{font-size:12px;font-weight:600}
textarea{width:100%;min-height:96px;resize:vertical;background:var(--wash);border:1px solid transparent;border-radius:12px;padding:12px 14px}
textarea:focus,.field:focus{background:var(--card);border-color:var(--sage-c);outline:none}
label.l{display:block;font-weight:600;margin-bottom:6px}
.field{width:100%;height:46px;background:var(--wash);border:1px solid transparent;border-radius:12px;padding:0 14px}
.chk{display:flex;align-items:center;gap:10px;font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--sage-c)}
/* Health */
.item{display:flex;align-items:center;gap:12px;padding:8px 0}
.item .ic{width:40px;height:40px;border-radius:10px;background:var(--wash);display:grid;place-items:center;color:var(--olive);flex:none}
.item .t{flex:1;min-width:0}

.item .k{font-weight:500;color:var(--fg2);white-space:nowrap}
.mealh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);padding-top:6px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.macro-h{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:6px}
.macro-f{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2);margin-top:6px}
.tgl{display:inline-flex;align-items:center;gap:6px;color:var(--sage);font-weight:600;font-size:13px}
/* Chrome */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:8px max(8px,env(safe-area-inset-left,0px)) 8px max(8px,env(safe-area-inset-right,0px))}

.fab{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px;border-radius:999px;background:var(--sage-c);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow);border:1px solid var(--line)}

.fab[hidden]{display:none}

.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;transform:translateY(105%);visibility:hidden;transition:transform .28s ease,visibility .28s;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none;visibility:visible}
.sheet .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 4px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.x{width:40px;height:40px;border-radius:50%;background:var(--wash2);display:grid;place-items:center;flex:none}
select.sel{height:36px;border-radius:999px;background:var(--wash2);border:0;padding:0 12px;font-weight:600;color:var(--sage)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--wash);border-radius:16px;padding:4px;gap:2px}
.seg button{height:40px;border-radius:12px;font-size:12.5px;font-weight:500;color:var(--fg2);display:flex;align-items:center;justify-content:center;gap:4px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--card);color:var(--sage);font-weight:600}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px}
.res .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.res .nm small{display:block;font-weight:400;color:var(--fg2);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
video.cam{width:100%;border-radius:20px;background:var(--wash2);aspect-ratio:4/3;object-fit:cover}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:500;z-index:50;transition:all .25s;max-width:calc(100% - 32px);text-align:center;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font-weight:700;color:var(--sage-c);filter:brightness(1.4)}
.syncbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--sage-t);color:var(--sage);font-size:12px;font-weight:600}
.syncbtn.err{background:var(--terra-t);color:var(--terra)}
.syncbtn.off{background:var(--wash2);color:var(--fg2)}
.theme-seg{display:grid;grid-template-columns:repeat(3,1fr)}
@media (prefers-reduced-motion:reduce){.sheet,.bar>i,.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img class="logo" src="icon.svg" alt="" width="36" height="36">Antly</div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="syncbtn off" id="syncBtn" aria-label="Sync and settings"><span class="ms s18" id="syncIc">cloud_off</span><span id="syncTx">Local</span></button>
      <button class="avatar" id="avatarBtn" aria-label="Account and settings">A</button>
    </div>
  </header>
  <main>
    <section class="view on" id="v-today"></section>
    <section class="view" id="v-tasks"></section>
    <section class="view" id="v-goals"></section>
    <section class="view" id="v-health"></section>
  </main>
</div>

<button class="fab" id="fabQuick"><span class="ms">add</span>Quick Action</button>

<nav class="tabs" aria-label="Main"><div class="in" role="tablist">
  <button class="tab" role="tab" data-act="tab" data-tab="today" aria-selected="true"><span class="ms">wb_sunny</span>Today</button>
  <button class="tab" role="tab" data-act="tab" data-tab="goals" aria-selected="false"><span class="ms">flag</span>Goals</button>
  <button class="tab" role="tab" data-act="tab" data-tab="tasks" aria-selected="false"><span class="ms">check_circle</span>Tasks</button>
  <button class="tab" role="tab" data-act="tab" data-tab="health" aria-selected="false"><span class="ms">favorite</span>Health</button>
</div></nav>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="shQuick" role="dialog" aria-label="Quick action"><div class="in">
  <div class="grab"></div>
  <div class="sheet-h"><h2 class="h-md">Quick action</h2><button class="x" data-act="close" aria-label="Close"><span class="ms">close</span></button></div>
  <div class="list">
    <button class="row" data-act="qa-water"><span class="rowmain"><span class="ms" style="color:var(--sage)">water_drop</span><span class="tx"><span>Log a glass of water</span></span></span></button>
    <button class="row" data-act="qa-task"><span class="rowmain"><span class="ms" style="color:var(--terra)">add_task</span><span class="tx"><span>Add a task or routine</span></span></span></button>
    <button class="row" data-act="qa-goal"><span class="rowmain"><span class="ms" style="color:var(--sage)">flag</span><span class="tx"><span>Add a goal</span></span></span></button>
    <button class="row" data-act="qa-mood"><span class="rowmain"><span class="ms" style="color:var(--sage)">sentiment_satisfied</span><span class="tx"><span>Check in on mood</span></span></span></button>
    <button class="row" data-act="qa-food"><span class="rowmain"><span class="ms" style="color:var(--olive)">restaurant_menu</span><span class="tx"><span>Log food (optional)</span></span></span></button>
  </div>
</div></div>

<div class="sheet" id="shTask" role="dialog" aria-label="Add task"><div class="in">
  <div class="grab"></div>
  <div class="sheet-h"><h2 class="h-md">Add to your day</h2><button class="x" data-act="close" aria-label="Close"><span class="ms">close</span></button></div>
  <div><label class="l" for="ntTitle">What is it?</label><input class="field" id="ntTitle" placeholder="e.g. Send the POC summary"></div>
  <div><label class="l" for="ntSec">Where does it go?</label>
    <select class="field" id="ntSec"><option value="todo">To-do</option><option value="focus">Today's focus (max 3)</option><option value="morning">Morning routine</option><option value="evening">Evening wind-down</option></select></div>
  <div id="ntTodoOpts" style="display:flex;flex-direction:column;gap:14px">
    <div><label class="l" for="ntDue">Due date (optional)</label><input class="field" type="date" id="ntDue"></div>
    <label class="chk"><input type="checkbox" id="ntPri">High priority</label>
  </div>
  <button class="btn" data-act="save-task">Add</button>
</div></div>

<div class="sheet" id="shGoal" role="dialog" aria-label="Add goal"><div class="in">
  <div class="grab"></div>
  <div class="sheet-h"><h2 class="h-md">Add a goal</h2><button class="x" data-act="close" aria-label="Close"><span class="ms">close</span></button></div>
  <div class="seg" id="ngType"><button data-act="ngtype" data-v="weekly" aria-pressed="true">Weekly habit</button><button data-act="ngtype" data-v="long" aria-pressed="false">Long-term goal</button></div>
  <div><label class="l" for="ngTitle">Goal</label><input class="field" id="ngTitle" placeholder="e.g. Run 5km"></div>
  <div id="ngWeeklyOpts"><label class="l" for="ngDays">Days per week</label><select class="field" id="ngDays"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></div>
  <div id="ngLongOpts" hidden><label class="l" for="ngDue">Target date (optional)</label><input class="field" type="date" id="ngDue"></div>
  <button class="btn" data-act="save-goal">Add goal</button>
</div></div>

<div class="sheet" id="shTargets" role="dialog" aria-label="Daily targets"><div class="in">
  <div class="grab"></div>
  <div class="sheet-h"><h2 class="h-md">Daily targets</h2><button class="x" data-act="close" aria-label="Close"><span class="ms">close</span></button></div>
  <p class="muted">Leave a field empty to skip it.</p>
  <div><label class="l" for="tgWater">Water (glasses)</label><input class="field" id="tgWater" inputmode="numeric"></div>
  <div><label class="l" for="tgCal">Calories (kcal)</label><input class="field" id="tgCal" inputmode="numeric"></div>
  <div class="grid2">
    <div><label class="l" for="tgP">Protein g</label><input class="field" id="tgP" inputmode="numeric"></div>
    <div><label class="l" for="tgC">Carbs g</label><input class="field" id="tgC" inputmode="numeric"></div>
    <div><label class="l" for="tgF">Fat g</label><input class="field" id="tgF" inputmode="numeric"></div>
  </div>
  <button class="btn" data-act="save-targets">Save targets</button>
</div></div>

<div class="sheet" id="shFood" role="dialog" aria-label="Log food"><div class="in">
  <div class="grab"></div>
  <div class="sheet-h">
    <div><div class="eyebrow" style="color:var(--sage)">Optional</div><h2 class="h-md">Log food</h2></div>
    <button class="x" data-act="close" aria-label="Close"><span class="ms">close</span></button>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <select class="sel" id="fdMeal" aria-label="Meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option></select>
    <input class="sel" type="date" id="fdDate" aria-label="Date" style="color:var(--fg)">
  </div>
  <div class="seg" id="fdTabs">
    <button data-act="fdtab" data-v="search" aria-selected="true"><span class="ms s16">search</span>Search</button>
    <button data-act="fdtab" data-v="scan" aria-selected="false"><span class="ms s16">barcode_scanner</span>Scan</button>
    <button data-act="fdtab" data-v="mine" aria-selected="false"><span class="ms s16">bookmark</span>My foods</button>
    <button data-act="fdtab" data-v="quick" aria-selected="false"><span class="ms s16">bolt</span>Quick</button>
  </div>
  <div id="fdBody"></div>
</div></div>

<div class="sheet" id="shSync" role="dialog" aria-label="Sync and settings"><div class="in" id="syncBody"></div></div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTx"></span><button id="toastUndo" hidden>Undo</button></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var pad=function(n){return n<10?'0'+n:''+n};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var todayKey=function(){return ymd(new Date())};
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function parseYMD(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fmtShort(s){return parseYMD(s).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function daysBetween(a,b){return Math.round((parseYMD(b)-parseYMD(a))/86400000)}
function getMonday(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ic(n,c){return '<span class="ms '+(c||'')+'">'+n+'</span>'}
var DAYS=['M','T','W','T','F','S','S'], DAYN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function load(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function pctTier(p){return p>=100?'high':p>=50?'mid':'low'}

/* ---------- state (same keys as the original Daily Tracker so data and sync carry over) ---------- */
var KEYS=['routineItems','routineChecks','goalItems','todoItems','weeklyTasks','weeklyChecks','focusByDate','weeklyNotes','foodLog','foodDaily','foodFoods','foodTargets','moodByDate','waterByDate','settings'];
var OPTIONAL=['foodLog','foodDaily','foodFoods','foodTargets','moodByDate','waterByDate','settings'];
var ARRAYS=['routineItems','goalItems','todoItems','weeklyTasks','foodFoods'];
var D={};
D.routineItems=load('routineItems',[{id:'r-workout',text:'Morning workout'},{id:'r-water',text:'Drink water'},{id:'r-priorities',text:'Review priorities'}]);
D.goalItems=load('goalItems',load('importantItems',[]));
KEYS.forEach(function(k){if(D[k]===undefined)D[k]=load(k,ARRAYS.indexOf(k)>-1?[]:{})});
var applyingRemote=false;
function save(key){
  try{localStorage.setItem(key,JSON.stringify(D[key]))}catch(e){}
  if(applyingRemote)return;
  if(!window.cloudSignedIn){try{localStorage.setItem('trackerDirty','1')}catch(e){}}
  if(window.cloudPush)window.cloudPush();
}
var UI={tab:'today',selDate:todayKey(),tasksWk:0,goalsWk:0,gfilter:'all',showDone:false,foodOff:0,foodOpen:false,userName:'',
  sync:{kind:'off',msg:'Saved on this device only.',email:''},
  fd:{tab:'search',q:'',results:[],msg:'',picked:null,code:'',scanning:false}};
function waterGoal(){var g=parseInt((D.settings||{}).waterGoal,10);return g>0?g:8}

/* ---------- stats ---------- */
function routineDayComplete(ds){if(!D.routineItems.length)return false;var c=D.routineChecks[ds]||{};return D.routineItems.every(function(i){return c[i.id]})}
function streakFrom(fn){var d=new Date();d.setHours(0,0,0,0);if(!fn(ymd(d)))d=addDays(d,-1);var n=0;while(fn(ymd(d))&&n<3650){n++;d=addDays(d,-1)}return n}
var overallStreak=function(){return streakFrom(routineDayComplete)};
var habitStreak=function(id){return streakFrom(function(ds){return !!(D.routineChecks[ds]||{})[id]})};
function weekPctFor(monday){
  var wk=ymd(monday),s=0,g=0;
  D.weeklyTasks.forEach(function(t){
    var chk=((D.weeklyChecks[wk]||{})[t.id])||{},sc=0;
    for(var i=0;i<7;i++)if(chk[ymd(addDays(monday,i))])sc++;
    var goal=t.goal||1;s+=Math.min(sc,goal);g+=goal;
  });
  return g?Math.round(s/g*100):0;
}
function dayStats(ds){
  var rc=D.routineChecks[ds]||{},f=D.focusByDate[ds]||[];
  var tot=D.routineItems.length+f.length;
  var done=D.routineItems.filter(function(i){return rc[i.id]}).length+f.filter(function(x){return x.done}).length;
  return {tot:tot,done:done,pct:tot?Math.round(done/tot*100):0};
}
function goalsPct(){
  if(D.weeklyTasks.length)return weekPctFor(getMonday(new Date()));
  if(D.goalItems.length)return Math.round(D.goalItems.reduce(function(a,g){return a+(g.progress||0)},0)/D.goalItems.length);
  return null;
}
function waterToday(){return +(D.waterByDate[todayKey()]||0)}
function healthPct(){return Math.round((Math.min(100,waterToday()/waterGoal()*100)+(D.moodByDate[todayKey()]?100:0))/2)}
function sumEntries(list){return list.reduce(function(a,e){return {cal:a.cal+(e.cal||0),p:a.p+(e.p||0),c:a.c+(e.c||0),f:a.f+(e.f||0)}},{cal:0,p:0,c:0,f:0})}
function dayTotals(d){return D.foodLog[d]?sumEntries(D.foodLog[d]):(D.foodDaily[d]||{cal:0,p:0,c:0,f:0})}
var FOOD_KEEP_DAYS=90;
function compactFood(){
  var cutoff=ymd(addDays(new Date(),-FOOD_KEEP_DAYS)),changed=false;
  Object.keys(D.foodLog).forEach(function(d){
    if(d<cutoff){var t=sumEntries(D.foodLog[d]||[]);if(!D.foodDaily[d])D.foodDaily[d]={cal:Math.round(t.cal),p:Math.round(t.p),c:Math.round(t.c),f:Math.round(t.f)};delete D.foodLog[d];changed=true}
  });
  if(changed){save('foodLog');save('foodDaily')}
}
function iconFor(t){
  t=t.toLowerCase();
  var m=[[/water|hydrat/,'water_drop'],[/workout|gym|exercise|lift|run|yoga|stretch/,'fitness_center'],[/walk|steps/,'directions_walk'],[/read|book/,'menu_book'],[/medit|mindful|breath/,'self_improvement'],[/journal|write|note/,'edit_note'],[/sleep|bed/,'bedtime'],[/priorit|plan|review|calendar/,'event_note'],[/vitamin|med/,'medication'],[/clean|tidy/,'cleaning_services']];
  for(var i=0;i<m.length;i++)if(m[i][0].test(t))return m[i][1];
  return 'spa';
}

/* ---------- small renderers ---------- */
function ring(p,r,w,color){var c=2*Math.PI*r,s=2*(r+w);return '<svg viewBox="0 0 '+s+' '+s+'" aria-hidden="true"><circle cx="'+(r+w)+'" cy="'+(r+w)+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+w+'"/><circle cx="'+(r+w)+'" cy="'+(r+w)+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+(c*Math.min(100,Math.max(0,p))/100)+' '+c+'"/></svg>'}
function bar(p,cls){return '<div class="bar '+cls+'"><i style="width:'+Math.min(100,Math.max(0,p))+'%"></i></div>'}
function glassBars(){var o='';for(var i=0;i<waterGoal();i++)o+='<i class="'+(i<waterToday()?'on':'')+'"></i>';return o}
var MOODI=['sentiment_very_dissatisfied','sentiment_dissatisfied','sentiment_neutral','sentiment_satisfied','sentiment_very_satisfied'];
var MOODN=['Rough','Low','Okay','Good','Great'];
function moodWeekText(){
  var mon=getMonday(new Date()),v=[];
  for(var i=0;i<7;i++){var m=D.moodByDate[ymd(addDays(mon,i))];if(m)v.push(m)}
  if(!v.length)return 'No check-ins yet this week';
  var a=v.reduce(function(x,y){return x+y},0)/v.length;
  return a>=4?'Mostly good this week':a>=3?'Steady this week':'On the low side this week';
}
function moodButtons(){
  var m=D.moodByDate[todayKey()];
  return '<div class="mood" role="group" aria-label="Mood today">'+MOODI.map(function(n,i){return '<button data-act="mood" data-v="'+(i+1)+'" aria-pressed="'+(m===i+1)+'" aria-label="'+MOODN[i]+'">'+ic(n,'s24'+(m===i+1?' f':''))+'</button>'}).join('')+'</div>';
}
function greetingText(){var h=new Date().getHours();return (h<12?'Good morning':h<17?'Good afternoon':'Good evening')+(UI.userName?', '+esc(UI.userName):'')}

function vToday(){
  var today=todayKey(),st=dayStats(today),gp=goalsPct(),hp=healthPct();
  var parts=[hp];if(gp!==null)parts.push(Math.min(100,gp));if(st.tot)parts.push(st.pct);
  var bal=Math.round(parts.reduce(function(a,b){return a+b},0)/parts.length);
  var focus=D.focusByDate[today]||[];
  var prime=focus.filter(function(x){return !x.done})[0];
  var rc=D.routineChecks[today]||{};
  var openTodos=D.todoItems.filter(function(t){return !t.done});
  var overdue=openTodos.filter(function(t){return t.due&&t.due<today}).length;
  var h='';
  h+='<div><div class="eyebrow">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+'</div><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px"><h1 class="h-xl">'+greetingText()+'</h1><span class="pill wash"><span class="dot" style="color:var(--sage)"></span>'+(bal>=70?'In Flow':bal>=30?'Building':'Fresh start')+'</span></div></div>';
  h+='<div class="card harmony"><div><h2 class="h-md">Daily Harmony</h2><p class="muted">Tasks, goals and health in one rhythm</p></div>';
  h+='<div class="harmony-row"><div class="ring">'+ring(bal,40,8,'var(--sage-c)')+'<div class="c"><b class="num">'+bal+'%</b><span>BALANCE</span></div></div><div class="meters">';
  h+='<div><div class="meter-h"><span>Goals Target</span><span class="num">'+(gp===null?'—':gp+'%')+'</span></div>'+bar(gp||0,'sage')+'</div>';
  h+='<div><div class="meter-h"><span>Tasks Closed</span><span class="num">'+st.done+' / '+st.tot+'</span></div>'+bar(st.pct,'terra')+'</div>';
  h+='<div><div class="meter-h"><span>Health Habits</span><span class="num">'+hp+'%</span></div>'+bar(hp,'olive')+'</div></div></div>';
  var note=!st.tot&&!openTodos.length?'Add a focus or a routine to get going.':st.pct===100?'Everything for today is done. Nice work.':(st.tot-st.done)+' thing'+(st.tot-st.done===1?'':'s')+' left in your focus and routine'+(openTodos.length?'; '+openTodos.length+' open to-do'+(openTodos.length===1?'':'s')+(overdue?' ('+overdue+' overdue)':''):'')+'.';
  h+='<div class="note">'+ic('eco','s18')+'<span style="flex:1">'+esc(note)+'</span><span class="pill sage num">'+overallStreak()+'d streak</span></div></div>';
  h+='<div class="sec"><div class="sec-h"><span class="eyebrow">Prime objective</span>'+(prime?'<span class="eyebrow" style="color:var(--terra)">Today’s focus</span>':'')+'</div>';
  if(prime)h+='<div class="card"><button class="prime" data-act="tog" data-kind="focus" data-id="'+prime.id+'" data-date="'+today+'"><span class="cb" style="width:40px;height:40px;border-radius:10px;border-width:2px"></span><span class="t"><span class="h-sm" style="display:block">'+esc(prime.text)+'</span><span class="meta"><span class="time">'+ic('flag','s14')+focus.filter(function(x){return x.done}).length+' of '+focus.length+' priorities done</span></span></span></button></div>';
  else if(focus.length)h+='<div class="card" style="display:flex;gap:14px;align-items:center">'+ic('stars','s24 f')+'<div><b>Focus cleared</b><p class="muted">Every priority for today is done.</p></div></div>';
  else h+='<div class="card" style="display:flex;gap:14px;align-items:center"><div style="flex:1"><b>No focus set for today</b><p class="muted">Pick up to three priorities.</p></div><button class="btn sm" data-act="open-add" data-sec="focus">Set focus</button></div>';
  h+='</div>';
  h+='<div class="sec"><div class="sec-h"><h2 class="h-md">Daily Routine</h2><button class="link" data-act="go" data-tab="tasks">See All</button></div>';
  if(D.routineItems.length){h+='<div class="chips">'+D.routineItems.map(function(r){var d=!!rc[r.id],s=habitStreak(r.id);return '<button class="rt'+(d?' done':'')+'" data-act="tog" data-kind="routine" data-id="'+r.id+'" data-date="'+today+'" aria-pressed="'+d+'"><span class="ic">'+ic(iconFor(r.text),d?'f':'')+'</span><span class="ck">'+ic('check','s16')+'</span><span><b>'+esc(r.text)+'</b><small>'+(s>1?s+'-day streak':d?'Done':'Tap to check in')+'</small></span></button>'}).join('')+'</div>'}
  else h+='<div class="empty">No routines yet. Add one from Quick Action.</div>';
  h+='</div>';

function todoTags(t){

    if(t.done)tags+='<span class="time">'+ic('event','s14')+fmtShort(t.due)+'</span>';

  }

}

/* ---------- actions ---------- */
function toggle(kind,id,date){
  if(kind==='focus'){var it=(D.focusByDate[date]||[]).filter(function(x){return x.id===id})[0];if(it){it.done=!it.done;save('focusByDate')}}
  else if(kind==='routine'){D.routineChecks[date]=D.routineChecks[date]||{};D.routineChecks[date][id]=!D.routineChecks[date][id];save('routineChecks')}
  else if(kind==='todo'){var t=D.todoItems.filter(function(x){return x.id===id})[0];if(t){t.done=!t.done;save('todoItems')}}
}
function remove(kind,id,date){

var scanStream=null,scanTimer=null;
function loadZX(){
  return new Promise(function(res,rej){
    if(window.ZXing)return res();
    var sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);
  });
}
function attachScan(){
  var v=$('#scanVid');if(!v)return;
  v.setAttribute('playsinline','');v.muted=true;
  var found=function(code){if(!scanTimer)return;stopScan();rFood();lookupBarcode(code)};
  var fail=function(){stopScan();UI.fd.msg='Camera is not available. Allow camera access in your browser, or type the barcode number instead.';rFood()};
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}}).then(function(s){
    scanStream=s;v.srcObject=s;return v.play();
  }).then(function(){
    if('BarcodeDetector' in window){
      // Built-in detector (Chrome on Android, desktop Chrome).
      var det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      scanTimer=setInterval(function(){det.detect(v).then(function(r){if(r.length)found(r[0].rawValue)}).catch(function(){})},300);
      return;
    }
    // Everything else (iPhone Safari, Firefox): decode camera frames with ZXing, loaded only when needed.
    fdSetMsg('Starting scanner\u2026');
    return loadZX().then(function(){
      var Z=window.ZXing,hints=new Map(),rd=new Z.MultiFormatReader();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
      hints.set(Z.DecodeHintType.TRY_HARDER,true);rd.setHints(hints);
      var cv=document.createElement('canvas'),cx=cv.getContext('2d');
      scanTimer=setInterval(function(){
        if(!v.videoWidth)return;
        var sc=Math.min(1,900/v.videoWidth);cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);
        cx.drawImage(v,0,0,cv.width,cv.height);
        try{found(rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText())}catch(e){}
      },250);
      fdSetMsg('Point the camera at a barcode.');
    });
  }).catch(fail);
}

  clearInterval(scanTimer);scanTimer=null;
  if(scanStream){scanStream.getTracks().forEach(function(t){t.stop()});scanStream=null}

function deepOr(a,b){
  if(a&&b&&typeof a==='object'&&typeof b==='object'){var o={};new Set(Object.keys(a).concat(Object.keys(b))).forEach(function(k){o[k]=deepOr(a[k],b[k])});return o}

    goalItems:mergeArr(a.goalItems,b.goalItems),todoItems:mergeArr(a.todoItems,b.todoItems),

    case 'del':remove(ds.kind,ds.id,ds.date);break;

    case 'gf':UI.gfilter=v;render();break;
    case 'wkday':var wk=ds.wk;D.weeklyChecks[wk]=D.weeklyChecks[wk]||{};D.weeklyChecks[wk][ds.id]=D.weeklyChecks[wk][ds.id]||{};D.weeklyChecks[wk][ds.id][ds.date]=!D.weeklyChecks[wk][ds.id][ds.date];save('weeklyChecks');render();break;
    case 'wkgoal':var wt=D.weeklyTasks.filter(function(x){return x.id===ds.id})[0];if(wt){wt.goal=Math.max(1,Math.min(7,(wt.goal||1)+ +v));save('weeklyTasks');render()}break;
    case 'gpin':var g=D.goalItems.filter(function(x){return x.id===ds.id})[0];if(g){g.pinned=!g.pinned;save('goalItems');render()}break;
    case 'open-add':openAddSheet(ds.sec);break;

    case 'qa-task':openAddSheet('todo');break;
    case 'qa-goal':openGoalSheet();break;
    case 'qa-mood':closeSheets();show('today');setTimeout(function(){var m=$('.mood');if(m)m.scrollIntoView({behavior:'smooth',block:'center'})},60);break;
    case 'qa-food':case 'open-food':openFood();break;
    case 'foodtog':UI.foodOpen=!UI.foodOpen;render();break;
    case 'foodday':UI.foodOff=Math.min(0,Math.max(-(FOOD_KEEP_DAYS-1),UI.foodOff+ +v));render();break;
    case 'open-targets':var tg=D.foodTargets||{};$('#tgWater').value=(D.settings||{}).waterGoal||'';$('#tgCal').value=tg.cal||'';$('#tgP').value=tg.p||'';$('#tgC').value=tg.c||'';$('#tgF').value=tg.f||'';closeSheets();openSheet('#shTargets');break;
    case 'save-targets':
      var nt={};[['cal','tgCal'],['p','tgP'],['c','tgC'],['f','tgF']].forEach(function(p){var n=Math.round(fdNum($('#'+p[1]).value));if(n)nt[p[0]]=n});
      D.foodTargets=nt;save('foodTargets');
      var wg=Math.round(fdNum($('#tgWater').value));D.settings=Object.assign({},D.settings||{});if(wg)D.settings.waterGoal=Math.min(30,wg);else delete D.settings.waterGoal;save('settings');
      closeSheets();render();toast('Targets saved');break;
    case 'fdtab':stopScan();UI.fd.tab=v;UI.fd.msg='';UI.fd.picked=null;rFood();break;
    case 'fd-pick':UI.fd.picked=UI.fd.results[+ds.i];rFood();var pp=$('#pickPanel');if(pp)pp.scrollIntoView({block:'nearest',behavior:'smooth'});break;
    case 'fd-addpick':
      var p=UI.fd.picked,gr=fdNum($('#fdGrams').value);if(!p)break;if(!gr){toast('Enter an amount in grams');break}
      var k=gr/100;
      if($('#fdSavePick').checked){D.foodFoods.push({id:uid(),name:p.name,serving:'100 g',cal:p.cal,p:p.p,c:p.c,f:p.f});save('foodFoods')}
      addEntry({name:p.name+' ('+Math.round(gr)+' g)',cal:Math.round(p.cal*k),p:r1(p.p*k),c:r1(p.c*k),f:r1(p.f*k)});break;
    case 'fd-addmine':var f=D.foodFoods.filter(function(x){return x.id===ds.id})[0];if(!f)break;var sv=fdNum(($('#fdServ')||{}).value)||1;
      addEntry({name:sv===1?f.name:f.name+' ×'+sv,cal:Math.round(f.cal*sv),p:r1(f.p*sv),c:r1(f.c*sv),f:r1(f.f*sv)});break;
    case 'fd-delmine':D.foodFoods=D.foodFoods.filter(function(x){return x.id!==ds.id});save('foodFoods');rFood();break;
    case 'fd-addquick':
      var pr=fdNum($('#fdPIn').value),cr=fdNum($('#fdCIn').value),fr=fdNum($('#fdFIn').value),cal=fdNum($('#fdCalIn').value);
      if(!cal&&(pr||cr||fr))cal=kcalFrom(pr,cr,fr);if(!cal){toast('Enter calories or at least one macro');break}
      var nm=$('#fdName').value.trim()||'Food',vals={cal:Math.round(cal),p:r1(pr),c:r1(cr),f:r1(fr)};
      if($('#fdSaveFood').checked){D.foodFoods.push(Object.assign({id:uid(),name:nm,serving:'1 serving'},vals));save('foodFoods')}
      addEntry(Object.assign({name:nm},vals));closeSheets();break;
    case 'fd-startscan':UI.fd.scanning=true;rFood();break;
    case 'fd-stopscan':stopScan();rFood();break;
    case 'signin':if(window.cloudSignIn)window.cloudSignIn();else toast('Sign-in needs an internet connection');break;
    case 'signout':if(window.cloudSignOut)window.cloudSignOut();break;
    case 'theme':applyTheme(v);break;
    case 'export':
      var blob=new Blob([JSON.stringify(getState(),null,2)],{type:'application/json'}),an=document.createElement('a');
      an.href=URL.createObjectURL(blob);an.download='antly-'+todayKey()+'.json';document.body.appendChild(an);an.click();an.remove();setTimeout(function(){URL.revokeObjectURL(an.href)},1000);break;
    case 'import':$('#importFile').click();break;
  }
});
$('#scrim').addEventListener('click',closeSheets);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheets()});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='ntSec'){$('#ntTodoOpts').hidden=(t.value!=='todo')}
  if(t.dataset&&t.dataset.prog){var g=D.goalItems.filter(function(x){return x.id===t.dataset.prog})[0];if(g){g.progress=parseInt(t.value,10);save('goalItems');render()}}
  if(t.id==='importFile'){
    var f=t.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){
      try{var data=JSON.parse(r.result);if(!data||typeof data!=='object')throw new Error('bad');
        applyState(mergeState(getState(),data));KEYS.forEach(save);toast('Imported');
      }catch(err){toast('That file is not a valid Antly or Daily Tracker export')}
      t.value='';
    };r.readAsText(f);
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.prog){var el=document.getElementById('gp-'+t.dataset.prog);if(el)el.textContent=t.value+'%'}
  if(t.id==='wkNote'){
    clearTimeout(UI.noteT);var wk=t.dataset.wk,v=t.value;
    UI.noteT=setTimeout(function(){if(v.trim())D.weeklyNotes[wk]=v;else delete D.weeklyNotes[wk];save('weeklyNotes')},600);
  }
  if(t.id==='fdGrams')pickPreview();
  if(t.id==='fdQ')UI.fd.q=t.value;
  if(t.id==='fdCode')UI.fd.code=t.value;
});
document.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();
  if(f.id==='quickAdd'){var i=$('#qaText'),v=i.value.trim();if(!v)return;D.todoItems.push({id:uid(),text:v,done:false,due:'',priority:false});save('todoItems');i.value='';render();toast('Task added');setTimeout(function(){var q=$('#qaText');if(q)q.focus()},0)}
  if(f.id==='fdSearchForm')foodSearch();
  if(f.id==='fdCodeForm')lookupBarcode($('#fdCode').value);
});
document.addEventListener('visibilitychange',function(){if(!document.hidden){if(UI.selDate<ymd(getMonday(new Date()))&&UI.tasksWk===0)UI.selDate=todayKey();render()}});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){render()});

render();show('today');
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Same Firebase project and document as the original Daily Tracker, so existing data and sign-in carry over.
const firebaseConfig = {
  apiKey: "AIzaSyCC4R4y19E_oqc7KFGiuSLjl72UAmawswI",
  authDomain: "daily-tracker-9ddd5.firebaseapp.com",
  projectId: "daily-tracker-9ddd5",
  storageBucket: "daily-tracker-9ddd5.firebasestorage.app",
  messagingSenderId: "521984800225",
  appId: "1:521984800225:web:84179dfe76e203c1cc0ea0"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const T = window.Antly;
let ref = null, unsub = null, pushTimer = null, lastJson = '', email = '';

const status = (kind, msg) => T.setSync(kind, msg, email);

window.cloudSignIn = async () => {
  const p = new GoogleAuthProvider();
  try { await signInWithPopup(auth, p); }
  catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
      try { await signInWithRedirect(auth, p); } catch (e2) { status('err', 'Sign-in failed (' + e2.code + ').'); }
    } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
      status('err', 'Sign-in failed (' + e.code + ').');
    }
  }
};
window.cloudSignOut = () => signOut(auth);

async function push() {
  if (!ref) return;
  const json = JSON.stringify(T.getState());
  lastJson = json;
  try {
    await setDoc(ref, { json, updatedAt: serverTimestamp() });
    status('ok', 'Synced.');
  } catch (e) { console.error(e); status('err', 'Sync error. It will retry on the next change.'); }
}
window.cloudPush = () => {
  if (!ref) return;
  clearTimeout(pushTimer);
  status('busy', 'Saving…');
  pushTimer = setTimeout(push, 400);
};

onAuthStateChanged(auth, async (user) => {
  if (unsub) { unsub(); unsub = null; }
  ref = null;
  window.cloudSignedIn = false;
  if (!user) { email = ''; T.setUserName(''); status('off', 'Saved on this device only.'); return; }
  email = user.email || 'Signed in';
  T.setUserName(user.displayName || '');
  status('busy', 'Syncing…');
  const r = doc(db, 'users', user.uid, 'data', 'main');
  try {
    const snap = await getDoc(r);
    if (snap.exists()) {
      const remote = JSON.parse(snap.data().json);
      if (T.isDirty()) {
        T.applyState(T.mergeState(T.getState(), remote));
        ref = r;
        await push();
      } else {
        T.applyState(remote);
        lastJson = snap.data().json;
        ref = r;
      }
    } else {
      ref = r;
      await push();
    }
    T.clearDirty();
    window.cloudSignedIn = true;
    status('ok', 'Synced.');
    unsub = onSnapshot(r, (s) => {
      if (s.metadata.hasPendingWrites || !s.exists()) return;
      const json = s.data().json;
      if (json === lastJson) return;
      lastJson = json;
      T.applyState(JSON.parse(json));
      status('ok', 'Synced.');
    });
  } catch (e) {
    console.error(e);
    ref = null;
    status('err', 'Sync unavailable (' + (e.code || 'error') + '). Using this device only.');
  }
});
</script>
